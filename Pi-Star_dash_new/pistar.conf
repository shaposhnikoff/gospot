# Pi-Star dashboard: system paths and deployment settings.
#
# This is the single place for paths to binaries, configuration files, data
# sets, logs and services. Code, helpers and scripts read these values; do not
# hard-code them elsewhere (see AGENTS.md).
#
# Installed on the board as /etc/pistar-dashboard/pistar.conf (a Debian
# conffile: local edits survive package upgrades). Restart pistar-panel,
# pistar-wizard and psdash-stage after editing it on a board.
#
# Format: KEY=value, one per line; '#' starts a comment line. No quotes, no
# spaces, no variable expansion, so Bash `source`, Go and Python read it alike.
# Runtime paths must be absolute. Paths in the "Development machine" section
# are relative to the directory of this file.

# --- Pi-Star layout: programs, data sets, logs ---------------------------------
PISTAR_BIN_DIR=/usr/local/bin
PISTAR_SBIN_DIR=/usr/local/sbin
PISTAR_HOSTS_DIR=/usr/local/etc
PISTAR_LOG_DIR=/var/log/pi-star
# Output of the native Update page (HostFilesUpdate.sh + apt), as in Pi-Star.
PISTAR_UPDATE_LOG=/var/log/pi-star/pi-star_update.log
# Output of Expert > FW (pistar-modemupgrade writes it itself).
MODEM_FLASH_LOG=/var/log/pi-star/pi-star_modemflash.log
# Output of the Expert Jitter Test (jitter_test.php). pistar-jittertest appends
# to this fixed path itself, so keep it equal to the script's own path.
PISTAR_JITTER_LOG=/var/log/pi-star/pi-star_icmptest.log
# A jitter test run (pistar-jittertest in PISTAR_SBIN_DIR) is stopped after
# this many seconds.
JITTER_TIMEOUT=120
# PiStar-Keeper logbook: the D-Star Link Manager shows its last 5 lines and
# offers it for download while pistar-keeper runs (link_manager.php).
# ircDDBGateway's Links.log, Headers.log and STARnet.log are read from
# PISTAR_LOG_DIR, the D-Star host lists from PISTAR_HOSTS_DIR and
# remotecontrold (link/unlink) from PISTAR_BIN_DIR.
PISTAR_KEEPER_LOG=/var/pistar-keeper/pistar-keeper.log
PISTAR_RELEASE_FILE=/etc/pistar-release
PISTAR_CSS_FILE=/etc/pistar-css.ini
HOSTNAME_FILE=/etc/hostname

# Controller markers: which radio controller is configured.
MARKER_MMDVMHOST=/etc/dstar-radio.mmdvmhost
MARKER_DSTARREPEATER=/etc/dstar-radio.dstarrepeater

# --- Radio service configuration files -----------------------------------------
CONF_MMDVMHOST=/etc/mmdvmhost
CONF_DMRGATEWAY=/etc/dmrgateway
CONF_YSFGATEWAY=/etc/ysfgateway
CONF_P25GATEWAY=/etc/p25gateway
CONF_NXDNGATEWAY=/etc/nxdngateway
CONF_M17GATEWAY=/etc/m17gateway
CONF_DAPNETGATEWAY=/etc/dapnetgateway
CONF_DGIDGATEWAY=/etc/dgidgateway
CONF_APRSGATEWAY=/etc/aprsgateway
CONF_IRCDDBGATEWAY=/etc/ircddbgateway
CONF_DSTARREPEATER=/etc/dstarrepeater
CONF_TIMESERVER=/etc/timeserver
CONF_STARNETSERVER=/etc/starnetserver
CONF_YSF2DMR=/etc/ysf2dmr
CONF_YSF2NXDN=/etc/ysf2nxdn
CONF_YSF2P25=/etc/ysf2p25
CONF_DMR2YSF=/etc/dmr2ysf
CONF_DMR2NXDN=/etc/dmr2nxdn
CONF_PISTAR_REMOTE=/etc/pistar-remote
CONF_MOBILEGPS=/etc/mobilegps
# Pi-Star flag files the Configuration page toggles (names as in Pi-Star).
FLAG_TIMESERVER_DISABLE=/etc/timeserver.dissable
FLAG_HOSTFILES_NODEXTRA=/etc/hostfiles.nodextra
FLAG_HOSTFILES_YSFUPPER=/etc/hostfiles.ysfupper
# BrandMeister API key, INI "[key] apikey=..." as Expert > API Keys writes it.
BM_API_KEY_FILE=/etc/bmapi.key
DAPNET_API_KEY_FILE=/etc/dapnetapi.key
TGIF_API_KEY_FILE=/etc/tgifapi.key
# TGIF Static/Dynamic Talkgroup API (admin page, token above): the dashboard
# calls <url>static-talkgroups/<id> and <url>dynamic-talkgroups/<id>. Must be
# https and end with '/'; the token is sent to it as a Bearer header.
TGIF_API_URL=https://api.tgif.network/v1/
# Legacy TGIF Link Manager (no token): GET <url><id>/<slot>/<talkgroup>.
# Must end with '/'.
TGIF_SESSION_URL=http://tgif.network:5040/api/sessions/update/
# BrandMeister Hoseline player under Local RF Activity (listen only). The board
# relays one talkgroup per browser: it reads the public spotter token from the
# page (https, ending with '/'; the page embeds the spotter URL below) and
# opens the spotter WebSocket (wss, ending with '/') with that page's Origin.
HOSELINE_PAGE_URL=https://hose.brandmeister.network/
HOSELINE_SPOTTER_URL=wss://hose.brandmeister.network/spotter/
# Browsers that may listen at once, per dashboard service (operator and admin
# each); one upstream connection per listener. 1 to 32.
HOSELINE_MAX_LISTENERS=3
# Talkgroups offered besides the hotspot's BrandMeister profile ones: comma
# separated, 91 to 99999999.
HOSELINE_TALKGROUPS=91,2504,2550,9990
# Owner of the API key files (mode 0600): the HTTPS management service user.
DASHBOARD_ADMIN_USER=pistar-wizard
# Configuration > Firewall / Auto AP / password.
HOSTAPD_CONF=/etc/hostapd/hostapd.conf
HOSTAP_OFF_FLAG=/etc/hostap.off
PISTAR_UPNP_SCRIPT=/usr/local/sbin/pistar-upnp.service
HOSTS_FILE=/etc/hosts
DHCPCD_CONF=/etc/dhcpcd.conf
# Linux account whose password Configuration > Remote Access Password sets
# together with the dashboard password (Pi-Star uses "pi-star").
PISTAR_LINUX_USER=pi-star
# Web SSH client settings (shellinabox), if installed.
SHELLINABOX_DEFAULTS=/etc/default/shellinabox
# Files of Expert > Full Edit.
WPA_SUPPLICANT_CONF=/etc/wpa_supplicant/wpa_supplicant.conf
CRONTAB_FILE=/etc/crontab

# --- Wi-Fi page (admin/wifi.php) -----------------------------------------------
# Who manages Wi-Fi on this system: "networkmanager" (Raspberry Pi OS Bookworm
# and Trixie: nmcli connection profiles) or "wpa_supplicant" (classic Pi-Star:
# network blocks in WPA_SUPPLICANT_CONF, reloaded with wpa_cli).
WIFI_BACKEND=networkmanager
# The wireless interface the page shows, scans with and resets.
WIFI_INTERFACE=wlan0
# Kernel interface directory: presence, MAC address, state and counters.
SYSFS_NET_DIR=/sys/class/net
# wpa_supplicant control socket directory (ctrl_interface of a new
# WPA_SUPPLICANT_CONF and wpa_cli -p).
WPA_CTRL_DIR=/var/run/wpa_supplicant
# Persistent Wi-Fi country of the networkmanager backend: a cfg80211 module
# option file ("options cfg80211 ieee80211_regdom=XX"), applied now with iw.
WIFI_REGDOM_CONF=/etc/modprobe.d/pistar-wifi-country.conf
# Programs the root helper runs for the Wi-Fi page (argument lists, no shell).
# PSKs are hashed in the helper itself, so wpa_passphrase is not needed.
NMCLI_BIN=/usr/bin/nmcli
WPA_CLI_BIN=/usr/sbin/wpa_cli
IP_BIN=/usr/bin/ip
IW_BIN=/usr/sbin/iw

# Where the dashboard reads radio logs: "files" (Pi-Star: MMDVM-YYYY-MM-DD.log
# and DMRGateway-YYYY-MM-DD.log in PISTAR_LOG_DIR, UTC dates) or "journal"
# (upstream builds logging to systemd-journald under the units below).
RADIO_LOG_SOURCE=files

# --- systemd units of the radio services ---------------------------------------
UNIT_MMDVMHOST=mmdvmhost.service
UNIT_DMRGATEWAY=dmrgateway.service
# HTTPS management service; restarted after a Remote Access Password change.
UNIT_WIZARD=pistar-wizard.service

# --- Calibration (admin/calibration.php: MMDVMCal in PISTAR_BIN_DIR) -------------
# Units held stopped while MMDVMCal owns the modem, comma separated, as in
# pistar-mmdvmcal: the active ones are stopped in this order before
# UNIT_MMDVMHOST and started again in this order before UNIT_MMDVMHOST is
# restarted.
CALIBRATION_HOLD_UNITS=pistar-watchdog.timer,pistar-watchdog.service,mmdvmhost.timer
# Seconds of the first MMDVMCal run that pistar-mmdvmcal kills to wake the modem.
CALIBRATION_WARMUP=3
# A calibration whose page has not polled for this many seconds is stopped and
# MMDVMHost restored.
CALIBRATION_IDLE_TIMEOUT=30
# Hard limit of one calibration session, seconds.
CALIBRATION_MAX_RUNTIME=3600

# --- Radio platform package (pistar-radio) --------------------------------------
SYSTEMD_UNIT_DIR=/lib/systemd/system
RADIO_SHARE_DIR=/usr/share/pistar-radio
# D-Star daemons rebuilt for wxWidgets 3.2 (radio/build-dstar.sh): their AMBE
# voice data, as in the Pi-Star PS4 builds; host lists stay in PISTAR_HOSTS_DIR.
DSTAR_IRCDDB_DATA_DIR=/usr/local/etc/ircddbgateway
DSTAR_REPEATER_DATA_DIR=/usr/local/etc/dstarrepeater
RADIO_USER=mmdvm
# One-time migration of a board from the upstream layout (radio/migrate-board).
MIGRATE_FROM_MMDVMHOST=/etc/MMDVM-Host.ini
MIGRATE_FROM_DMRGATEWAY=/etc/DMRGateway.ini
MIGRATE_FROM_DATA_DIR=/var/lib/mmdvm
MIGRATION_BACKUP_DIR=/var/backups/pistar-migration

# --- Dashboard installation ----------------------------------------------------
DASHBOARD_LIB_DIR=/usr/lib/pistar-dashboard
DASHBOARD_UI_DIR=/usr/share/pistar-dashboard/ui
DASHBOARD_STATE_DIR=/var/lib/pistar-panel-config
DASHBOARD_BM_STATE_DIR=/var/lib/pistar-dashboard-bm
WIZARD_CONFIG_DIR=/etc/pistar-wizard
PANEL_PORT=8787
MANAGEMENT_PORT=8788
OPERATOR_PORT=8789

# --- Development machine: build and deployment ---------------------------------
DEPLOY_HOST=pistar3
DEPLOY_ADDRESS=192.168.210.194
REFERENCE_DASHBOARD_DIR=../Pi-Star_DV_Dash
PISTAR_BINARIES_BIN_DIR=../Pi-Star_v4_Binaries_Bin
PISTAR_BINARIES_SBIN_DIR=../Pi-Star_Binaries_sbin
