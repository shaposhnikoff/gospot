name: Build and publish Bookworm deb
on: push

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Pi-Star_dash_new/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache: false
      - name: Install dependencies and run tests
        working-directory: Pi-Star_dash_new
        run: |
          npm ci
          npm test
          go -C ../panel test ./...
          python3 -B -m unittest discover -s ../panel/helper
          debian/test-pistar-conf-merge.sh
          ../radio/test_seed_configs.sh
      - name: Build and check armhf package
        working-directory: Pi-Star_dash_new
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          base=$(sed -n 's/^Version: //p' debian/control)
          export DEB_VERSION="${base}+ci.${GITHUB_RUN_NUMBER}"
          scripts/build-deb
          packages=(build/release-*/pistar-dashboard_*_armhf.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Version)" = "$DEB_VERSION"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = armhf
          bash scripts/test-deb-entry "${packages[0]}"
          mkdir "$RUNNER_TEMP/release"
          cp "${packages[0]}" "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum *.deb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bookworm-armhf
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bookworm-armhf
          path: release
      - name: Publish package and SHA-256 in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          tag="deb-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.deb SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" *.deb SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Bookworm armhf · build $GITHUB_RUN_NUMBER" \
              --notes "Debian package built from commit $GITHUB_SHA."
          fi
