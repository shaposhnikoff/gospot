# GoSpot: system paths and deployment settings.
#
# This is the single place for paths to binaries, configuration files, data
# sets, logs and services. Code, helpers and scripts read these values; do not
# hard-code them elsewhere (see AGENTS.md).
#
# Installed on the board as /etc/gospot/gospot.conf (a Debian
# conffile: local edits survive package upgrades). Restart gospot-panel,
# gospot-wizard and gospot-stage after editing it on a board.
#
# Format: KEY=value, one per line; '#' starts a comment line. No quotes, no
# spaces, no variable expansion, so Bash `source`, Go and Python read it alike.
# Runtime paths must be absolute. Paths in the "Development machine" section
# are relative to the directory of this file.

# --- System layout (Pi-Star compatible, GoSpot names): programs, data, logs ---
GOSPOT_BIN_DIR=/usr/local/bin
GOSPOT_SBIN_DIR=/usr/local/sbin
GOSPOT_HOSTS_DIR=/usr/local/etc
GOSPOT_LOG_DIR=/var/log/gospot
# Output of the native Update page (HostFilesUpdate.sh + apt), as in Pi-Star.
GOSPOT_UPDATE_LOG=/var/log/gospot/gospot_update.log
# Output of Expert > FW (gospot-modemupgrade writes it itself).
MODEM_FLASH_LOG=/var/log/gospot/gospot_modemflash.log
# Output of the Expert Jitter Test (jitter_test.php). gospot-jittertest appends
# to this fixed path itself, so keep it equal to the script's own path.
GOSPOT_JITTER_LOG=/var/log/gospot/gospot_icmptest.log
# A jitter test run (gospot-jittertest in GOSPOT_SBIN_DIR) is stopped after
# this many seconds.
JITTER_TIMEOUT=120
# Keeper logbook (the PiStar-Keeper equivalent): the D-Star Link Manager shows
# its last 5 lines and offers it for download while gospot-keeper runs (link_manager.php).
# ircDDBGateway's Links.log, Headers.log and STARnet.log are read from
# GOSPOT_LOG_DIR, the D-Star host lists from GOSPOT_HOSTS_DIR and
# remotecontrold (link/unlink) from GOSPOT_BIN_DIR.
GOSPOT_KEEPER_LOG=/var/gospot-keeper/gospot-keeper.log
GOSPOT_RELEASE_FILE=/etc/gospot-release
GOSPOT_CSS_FILE=/etc/gospot-css.ini
HOSTNAME_FILE=/etc/hostname

# Controller markers: which radio controller is configured.
MARKER_MMDVMHOST=/etc/dstar-radio.mmdvmhost
MARKER_DSTARREPEATER=/etc/dstar-radio.dstarrepeater

# --- Radio service configuration files -----------------------------------------
CONF_MMDVMHOST=/etc/mmdvmhost
CONF_DMRGATEWAY=/etc/dmrgateway
CONF_YSFGATEWAY=/etc/ysfgateway
CONF_P25GATEWAY=/etc/p25gateway
CONF_NXDNGATEWAY=/etc/nxdngateway
CONF_M17GATEWAY=/etc/m17gateway
CONF_DAPNETGATEWAY=/etc/dapnetgateway
CONF_DGIDGATEWAY=/etc/dgidgateway
CONF_APRSGATEWAY=/etc/aprsgateway
CONF_IRCDDBGATEWAY=/etc/ircddbgateway
CONF_DSTARREPEATER=/etc/dstarrepeater
CONF_TIMESERVER=/etc/timeserver
CONF_STARNETSERVER=/etc/starnetserver
CONF_YSF2DMR=/etc/ysf2dmr
CONF_YSF2NXDN=/etc/ysf2nxdn
CONF_YSF2P25=/etc/ysf2p25
CONF_DMR2YSF=/etc/dmr2ysf
CONF_DMR2NXDN=/etc/dmr2nxdn
CONF_GOSPOT_REMOTE=/etc/gospot-remote
CONF_MOBILEGPS=/etc/mobilegps
# Pi-Star flag files the Configuration page toggles (names as in Pi-Star).
FLAG_TIMESERVER_DISABLE=/etc/timeserver.dissable
FLAG_HOSTFILES_NODEXTRA=/etc/hostfiles.nodextra
FLAG_HOSTFILES_YSFUPPER=/etc/hostfiles.ysfupper

# --- Host files (HostFilesUpdate.sh, gospot-hostfiles.timer) -------------------
# Published host-file site (github.com/shaposhnikoff/gospot-hostfiles): its
# manifest.json lists every file with size and SHA-256. HostFilesUpdate.sh
# reads the HOSTFILES_* keys from /etc/gospot/gospot.conf at run time, so an
# operator can point a board at another copy of the site.
HOSTFILES_BASE_URL=https://shaposhnikoff.github.io/gospot-hostfiles
# Verified downloads, the manifest and the last check time.
HOSTFILES_CACHE_DIR=/var/cache/gospot/hostfiles
# Operator additions: DMR_Hosts.txt, YSFHosts.txt and M17Hosts.txt here are
# appended to the downloaded lists, XLXHosts.txt lines replace entries with the
# same number, P25Hosts.txt and NXDNHosts.txt become the gateways' second
# (local) host lists. Same place as on Pi-Star.
HOSTFILES_LOCAL_DIR=/root
# Seconds one download may take before it is abandoned.
HOSTFILES_TIMEOUT=300
# A run within this many seconds of the last check does nothing (--force
# overrides).
HOSTFILES_MIN_INTERVAL=600
# BrandMeister API key, INI "[key] apikey=..." as Expert > API Keys writes it.
BM_API_KEY_FILE=/etc/bmapi.key
DAPNET_API_KEY_FILE=/etc/dapnetapi.key
TGIF_API_KEY_FILE=/etc/tgifapi.key
# TGIF Static/Dynamic Talkgroup API (admin page, token above): the dashboard
# calls <url>static-talkgroups/<id> and <url>dynamic-talkgroups/<id>. Must be
# https and end with '/'; the token is sent to it as a Bearer header.
TGIF_API_URL=https://api.tgif.network/v1/
# Legacy TGIF Link Manager (no token): GET <url><id>/<slot>/<talkgroup>.
# Must end with '/'.
TGIF_SESSION_URL=http://tgif.network:5040/api/sessions/update/
# BrandMeister Hoseline player under Local RF Activity (listen only). The board
# relays one talkgroup per browser: it reads the public spotter token from the
# page (https, ending with '/'; the page embeds the spotter URL below) and
# opens the spotter WebSocket (wss, ending with '/') with that page's Origin.
HOSELINE_PAGE_URL=https://hose.brandmeister.network/
HOSELINE_SPOTTER_URL=wss://hose.brandmeister.network/spotter/
# Browsers that may listen at once, per dashboard service (operator and admin
# each); one upstream connection per listener. 1 to 32.
HOSELINE_MAX_LISTENERS=3
# Talkgroups offered besides the hotspot's BrandMeister profile ones: comma
# separated, 91 to 99999999.
HOSELINE_TALKGROUPS=91,2504,2550,9990
# Owner of the API key files (mode 0600): the HTTPS management service user.
DASHBOARD_ADMIN_USER=gospot-wizard
# Configuration > Firewall / Auto AP / password.
HOSTAPD_CONF=/etc/hostapd/hostapd.conf
HOSTAP_OFF_FLAG=/etc/hostap.off
GOSPOT_UPNP_SCRIPT=/usr/local/sbin/gospot-upnp.service
HOSTS_FILE=/etc/hosts
DHCPCD_CONF=/etc/dhcpcd.conf
# Linux account whose password Configuration > Remote Access Password sets
# together with the dashboard password (Pi-Star uses "pi-star"; a board
# upgraded from pistar-dashboard keeps its previous value).
GOSPOT_LINUX_USER=gospot
# Web SSH client settings (shellinabox), if installed.
SHELLINABOX_DEFAULTS=/etc/default/shellinabox
# Files of Expert > Full Edit.
WPA_SUPPLICANT_CONF=/etc/wpa_supplicant/wpa_supplicant.conf
CRONTAB_FILE=/etc/crontab

# --- Wi-Fi page (admin/wifi.php) -----------------------------------------------
# Who manages Wi-Fi on this system: "networkmanager" (Raspberry Pi OS Bookworm
# and Trixie: nmcli connection profiles) or "wpa_supplicant" (classic Pi-Star:
# network blocks in WPA_SUPPLICANT_CONF, reloaded with wpa_cli).
WIFI_BACKEND=networkmanager
# The wireless interface the page shows, scans with and resets.
WIFI_INTERFACE=wlan0
# Kernel interface directory: presence, MAC address, state and counters.
SYSFS_NET_DIR=/sys/class/net
# wpa_supplicant control socket directory (ctrl_interface of a new
# WPA_SUPPLICANT_CONF and wpa_cli -p).
WPA_CTRL_DIR=/var/run/wpa_supplicant
# Persistent Wi-Fi country of the networkmanager backend: a cfg80211 module
# option file ("options cfg80211 ieee80211_regdom=XX"), applied now with iw.
WIFI_REGDOM_CONF=/etc/modprobe.d/gospot-wifi-country.conf
# Programs the root helper runs for the Wi-Fi page (argument lists, no shell).
# PSKs are hashed in the helper itself, so wpa_passphrase is not needed.
NMCLI_BIN=/usr/bin/nmcli
WPA_CLI_BIN=/usr/sbin/wpa_cli
IP_BIN=/usr/bin/ip
IW_BIN=/usr/sbin/iw

# Where the dashboard reads radio logs: "files" (Pi-Star: MMDVM-YYYY-MM-DD.log
# and DMRGateway-YYYY-MM-DD.log in GOSPOT_LOG_DIR, UTC dates) or "journal"
# (upstream builds logging to systemd-journald under the units below).
RADIO_LOG_SOURCE=files

# --- systemd units of the radio services ---------------------------------------
UNIT_MMDVMHOST=mmdvmhost.service
UNIT_DMRGATEWAY=dmrgateway.service
# HTTPS management service; restarted after a Remote Access Password change.
UNIT_WIZARD=gospot-wizard.service

# --- Calibration (admin/calibration.php: MMDVMCal in GOSPOT_BIN_DIR) -------------
# Units held stopped while MMDVMCal owns the modem, comma separated, as in
# gospot-mmdvmcal: the active ones are stopped in this order before
# UNIT_MMDVMHOST and started again in this order before UNIT_MMDVMHOST is
# restarted.
CALIBRATION_HOLD_UNITS=gospot-watchdog.timer,gospot-watchdog.service,mmdvmhost.timer
# Seconds of the first MMDVMCal run that gospot-mmdvmcal kills to wake the modem.
CALIBRATION_WARMUP=3
# A calibration whose page has not polled for this many seconds is stopped and
# MMDVMHost restored.
CALIBRATION_IDLE_TIMEOUT=30
# Hard limit of one calibration session, seconds.
CALIBRATION_MAX_RUNTIME=3600

# --- Radio platform package (gospot-radio) --------------------------------------
SYSTEMD_UNIT_DIR=/lib/systemd/system
RADIO_SHARE_DIR=/usr/share/gospot-radio
# D-Star daemons rebuilt for wxWidgets 3.2 (radio/build-dstar.sh): their AMBE
# voice data, as in the Pi-Star PS4 builds; host lists stay in GOSPOT_HOSTS_DIR.
DSTAR_IRCDDB_DATA_DIR=/usr/local/etc/ircddbgateway
DSTAR_REPEATER_DATA_DIR=/usr/local/etc/dstarrepeater
RADIO_USER=mmdvm
# One-time migration of a board from the upstream layout (radio/migrate-board).
MIGRATE_FROM_MMDVMHOST=/etc/MMDVM-Host.ini
MIGRATE_FROM_DMRGATEWAY=/etc/DMRGateway.ini
MIGRATE_FROM_DATA_DIR=/var/lib/mmdvm
MIGRATION_BACKUP_DIR=/var/backups/gospot-migration

# --- gospot-watchdog and gospot-remote (gospot-radio) -----------------------------
# Python 3 ports of the Pi-Star scripts; their handlers in GOSPOT_SBIN_DIR are
# named like these units, as in Pi-Star.
UNIT_GOSPOT_WATCHDOG=gospot-watchdog.service
UNIT_GOSPOT_REMOTE=gospot-remote.service
UNIT_DSTARREPEATER=dstarrepeater.service
# Log volume the watchdog keeps under 90% full: it removes rotated *.1 and
# *.1.gz files at its top level and *.gz files older than a day below it, and
# GOSPOT_LOG_DIR/*.log older than a day.
SYSTEM_LOG_DIR=/var/log
# Processes the watchdog keeps running, "comm-name:unit" comma separated; the
# unit is stopped and started when the process is missing. The DStarRepeater
# list applies with MARKER_DSTARREPEATER, the MMDVMHost one with
# MARKER_MMDVMHOST, the common one always.
WATCHDOG_DSTARREPEATER_PROCESSES=dstarrepeaterd:dstarrepeater.service
WATCHDOG_MMDVMHOST_PROCESSES=MMDVMHost:mmdvmhost.service,DMRGateway:dmrgateway.service,YSFGateway:ysfgateway.service,DGIdGateway:dgidgateway.service,P25Gateway:p25gateway.service,M17Gateway:m17gateway.service,NXDNGateway:nxdngateway.service,YSFParrot:ysfparrot.service,P25Parrot:p25parrot.service,NXDNParrot:nxdnparrot.service,YSF2DMR:ysf2dmr.service,YSF2NXDN:ysf2nxdn.service,YSF2P25:ysf2p25.service,DMR2YSF:dmr2ysf.service,DMR2NXDN:dmr2nxdn.service,DAPNETGateway:dapnetgateway.service
WATCHDOG_COMMON_PROCESSES=ircddbgatewayd:ircddbgateway.service,timeserverd:timeserver.service
# Units the keeper commands of CONF_GOSPOT_REMOTE act on, comma separated, in
# this order (as in Pi-Star; P25 svcrestart restarts DMRGateway there too).
# svckill stops the controller and the watchdog:
REMOTE_MMDVMHOST_STOP_UNITS=mmdvmhost.timer,gospot-watchdog.timer,mmdvmhost.service,gospot-watchdog.service
REMOTE_DSTARREPEATER_STOP_UNITS=dstarrepeater.timer,gospot-watchdog.timer,dstarrepeater.service,gospot-watchdog.service
# svcrestart, per mode (D-Star via MMDVMHost or via DStarRepeater):
REMOTE_DMR_RESTART_UNITS=mmdvmhost.service,dmrgateway.service
REMOTE_P25_RESTART_UNITS=mmdvmhost.service,dmrgateway.service
REMOTE_DSTAR_RESTART_UNITS=ircddbgateway.service,mmdvmhost.service
REMOTE_YSF_RESTART_UNITS=ysfgateway.service,mmdvmhost.service
REMOTE_DSTARREPEATER_RESTART_UNITS=ircddbgateway.service,dstarrepeater.service

# --- Dashboard installation ----------------------------------------------------
DASHBOARD_LIB_DIR=/usr/lib/gospot
DASHBOARD_UI_DIR=/usr/share/gospot/ui
DASHBOARD_STATE_DIR=/var/lib/gospot
DASHBOARD_BM_STATE_DIR=/var/lib/gospot-bm
WIZARD_CONFIG_DIR=/etc/gospot/wizard
PANEL_PORT=8787
MANAGEMENT_PORT=8788
OPERATOR_PORT=8789

# --- Development machine: build and deployment ---------------------------------
DEPLOY_HOST=pistar3
DEPLOY_ADDRESS=192.168.210.194
REFERENCE_DASHBOARD_DIR=../Pi-Star_DV_Dash
REFERENCE_BINARIES_BIN_DIR=../Pi-Star_v4_Binaries_Bin
REFERENCE_BINARIES_SBIN_DIR=../Pi-Star_Binaries_sbin
